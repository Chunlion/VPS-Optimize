name: Shell Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run selfcheck
        run: |
          bash scripts/selfcheck.sh

  windows-selfcheck-wrapper:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate selfcheck.ps1 wrapper
        shell: pwsh
        run: |
          $path = (Resolve-Path "scripts/selfcheck.ps1").Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          $script = Get-Content -Raw -Path $path
          $required = @(
            'Get-Command wsl.exe',
            'wslpath -a -u',
            'bash scripts/selfcheck.sh',
            'exit $exitCode'
          )
          foreach ($needle in $required) {
            if (-not $script.Contains($needle)) {
              Write-Error "scripts/selfcheck.ps1 is missing required WSL delegation contract: $needle"
              exit 1
            }
          }

          $forbiddenInlineChecks = @(
            'bash scripts/build.sh',
            'bash scripts/compat-smoke.sh',
            'bash tests/smoke.sh',
            'bash tests/golden-render.sh',
            'go test ./...',
            'go vet ./...'
          )
          foreach ($needle in $forbiddenInlineChecks) {
            if ($script.Contains($needle)) {
              Write-Error "scripts/selfcheck.ps1 must delegate to scripts/selfcheck.sh instead of inlining: $needle"
              exit 1
            }
          }

  container-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:11
          - debian:12
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux:9
          - almalinux:9
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Install container test dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends bash ca-certificates git grep sed gawk coreutils diffutils findutils procps
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y bash ca-certificates git grep sed gawk diffutils findutils procps-ng
          else
            echo "Unsupported CI container package manager." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and syntax checks
        run: |
          bash scripts/build.sh
          bash -n vps.sh dist/vps.sh
          bash -n src/*.sh scripts/*.sh tests/*.sh

      - name: Run container-compatible smoke tests
        env:
          VPSO_CI_CONTAINER: "1"
        run: |
          bash tests/smoke.sh

      - name: Run compatibility smoke
        run: |
          bash scripts/compat-smoke.sh

      - name: Run golden render tests
        run: |
          bash tests/golden-render.sh
