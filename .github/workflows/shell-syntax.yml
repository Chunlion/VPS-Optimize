name: Shell Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          bash -n scripts/build.sh
          bash scripts/build.sh
          bash -n vps.sh
          bash -n dist/vps.sh
          bash -n src/common.sh src/ui.sh src/input.sh src/validate.sh src/rollback.sh src/backup.sh src/main.sh
          bash -n dog.sh
          bash -n xui-custom-manager.sh

      - name: Run ShellCheck error checks
        run: |
          shellcheck -S error vps.sh src/*.sh dist/vps.sh dog.sh xui-custom-manager.sh

      - name: Run smoke tests
        run: |
          bash tests/smoke.sh
