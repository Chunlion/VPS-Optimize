name: Shell Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ShellCheck
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y shellcheck

      - name: Run selfcheck
        env:
          VPSO_SELFCHECK_SKIP_DOCS: "1"
        run: |
          bash scripts/selfcheck.sh

  container-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux:9
          - almalinux:9
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Install container test dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            if [ -r /etc/os-release ] && grep -q '^ID=ubuntu$' /etc/os-release; then
              for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
                [ -f "$source_file" ] || continue
                sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' "$source_file"
              done
            fi
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::http::No-Cache=true -o Acquire::https::No-Cache=true update
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::http::No-Cache=true -o Acquire::https::No-Cache=true install -y --no-install-recommends bash ca-certificates git grep sed gawk coreutils diffutils findutils procps python3 jq
          elif command -v dnf >/dev/null 2>&1; then
            dnf --setopt=retries=3 install -y bash ca-certificates git grep sed gawk diffutils findutils procps-ng python3 jq
          else
            echo "Unsupported CI container package manager." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and syntax checks
        run: |
          bash scripts/build.sh
          bash scripts/syntax-check.sh

      - name: Run container-compatible smoke tests
        env:
          VPSO_CI_CONTAINER: "1"
        run: |
          bash tests/smoke.sh

      - name: Run compatibility smoke
        run: |
          bash scripts/compat-smoke.sh

      - name: Run golden render tests
        run: |
          bash tests/golden-render.sh
