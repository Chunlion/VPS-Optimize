name: Shell Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install docs dependencies
        run: npm ci

      - name: Install ShellCheck
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y shellcheck; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Package installation failed; retrying ($attempt/3)..." >&2
            sleep 5
          done

      - name: Run selfcheck
        run: |
          bash scripts/selfcheck.sh

  windows-selfcheck-wrapper:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate selfcheck.ps1 wrapper
        shell: pwsh
        run: |
          ./scripts/selfcheck-ps1-contract.ps1

  container-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:11
          - debian:12
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux:9
          - almalinux:9
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Install container test dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            if [ -r /etc/os-release ] && grep -q '^ID=ubuntu$' /etc/os-release; then
              for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
                [ -f "$source_file" ] || continue
                sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' "$source_file"
              done
            fi
            for attempt in 1 2 3; do
              if apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends bash ca-certificates git grep sed gawk coreutils diffutils findutils procps python3; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              echo "Package installation failed; retrying ($attempt/3)..." >&2
              sleep 5
            done
          elif command -v dnf >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if dnf --setopt=retries=3 install -y bash ca-certificates git grep sed gawk diffutils findutils procps-ng python3; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              echo "Package installation failed; retrying ($attempt/3)..." >&2
              sleep 5
            done
          else
            echo "Unsupported CI container package manager." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and syntax checks
        run: |
          bash scripts/build.sh
          bash -n vps.sh dist/vps.sh
          bash -n src/*.sh scripts/*.sh tests/*.sh

      - name: Run container-compatible smoke tests
        env:
          VPSO_CI_CONTAINER: "1"
        run: |
          bash tests/smoke.sh

      - name: Run compatibility smoke
        run: |
          bash scripts/compat-smoke.sh

      - name: Run golden render tests
        run: |
          bash tests/golden-render.sh
