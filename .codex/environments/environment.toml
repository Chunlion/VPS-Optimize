# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "VPS-Optimize"

[setup]
script = '''
WORKTREE="$(wslpath -u "$CODEX_WORKTREE_PATH")"
cd "$WORKTREE"

echo "==> environment"
pwd
git status --short
bash --version | head -n 1
go version
shellcheck --version | head -n 1 || true

echo "==> baseline checks"
bash scripts/build.sh
bash scripts/selfcheck.sh
bash scripts/compat-smoke.sh
go test ./...
go vet ./...
git diff --check
'''

[setup.win32]
script = '''
$wslPath = wsl wslpath -u "$env:CODEX_WORKTREE_PATH"
wsl bash -lc "cd '$wslPath' && pwd && git status --short && bash scripts/build.sh && bash scripts/selfcheck.sh && bash scripts/compat-smoke.sh && go test ./... && go vet ./... && git diff --check"
'''

[cleanup]
script = ""

[cleanup.win32]
script = '''
$wslPath = wsl wslpath -u "$env:CODEX_WORKTREE_PATH"
wsl bash -lc "cd '$wslPath' && git status --short && go clean -testcache 2>/dev/null || true"
'''
